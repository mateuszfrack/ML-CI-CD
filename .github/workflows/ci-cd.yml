name: ML CI/CD Pipeline

# Uruchamia się automatycznie przy pushu na main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Ustawienie środowiska Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Instalacja zależności
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Uruchomienie testów jednostkowych
      run: |
        pytest test_model.py

  # ZADANIE 3: Opcjonalne budowanie Dockera po udanych testach
  build-and-push:
    needs: test 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v3
    - name: Logowanie do GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Budowa i publikacja obrazu Docker
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}/ml-api-image:latest